          text(file, 57, 196 + index * 43, index === 0 ? colors.bright_text : colors.subtext1, 20, 'JetBrains');
        });
        code(294, 177, 1096);
        ctx.fillStyle = colors.mantle; ctx.fillRect(24, 776, 1392, 36);
        line(24, 776, 1416, 776);
        text('main', 48, 794, colors.subtext0, 18, 'JetBrains');
        text('Go', 1358, 794, colors.subtext0, 18, 'JetBrains');
        ctx.restore();
        ctx.strokeStyle = colors.surface2; ctx.beginPath(); ctx.roundRect(24, 98, 1392, 714, 14); ctx.stroke();
      } else if (option === 'code') {
        text('main.go', 1294, 50, colors.subtext1, 21, 'JetBrains');
        code(72, 124, 1296);
      } else {
        text('main.go', 1050, 50, colors.subtext1, 21, 'JetBrains');
        code(48, 136, 1084);
        line(1162, 136, 1162, 756);
        text('Surfaces', 1190, 148, colors.subtext0, 21);
        [['Base', 'base'], ['Surface', 'surface0'], ['Selection', 'surface1']].forEach(([label, key], index) => {
          ctx.fillStyle = colors[key]; ctx.fillRect(1190, 184 + index * 48, 26, 26);
          ctx.strokeStyle = colors.surface2; ctx.strokeRect(1190, 184 + index * 48, 26, 26);
          text(label, 1230, 197 + index * 48, colors.subtext0, 19);
        });
        text('Syntax', 1190, 382, colors.subtext0, 21);
        [['Keywords', 'purple'], ['Functions', 'teal'], ['Types', 'sky'], ['Fields', 'blue'], ['Strings', 'green']].forEach(([label, key], index) => {
          ctx.fillStyle = colors[key]; ctx.fillRect(1190, 420 + index * 48, 26, 26);
          text(label, 1230, 433 + index * 48, colors.subtext0, 19);
        });
      }
      canvas.setAttribute('aria-label', labels[option] + ' concept for Oxide');
    }
    const ready = Promise.all([document.fonts.load('22px Geist'), document.fonts.load('22px JetBrains'), source.decode(), brand.decode()]);
    document.querySelectorAll('[data-option]').forEach(button => button.addEventListener('click', async () => {
      await ready;
      selected = button.dataset.option;
      document.querySelectorAll('[data-option]').forEach(peer => peer.setAttribute('aria-pressed', String(peer === button)));
      draw(selected);
    }));
    ready.then(() => draw(selected));
    window.exportExamples = async () => {
      await ready;
      const outputs = [];
      for (const option of Object.keys(labels)) {
        draw(option);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('PNG export failed');
        const response = await fetch('/export/' + option, { method: 'POST', body: blob });
        if (!response.ok) throw new Error('Saving PNG failed');
        outputs.push(await response.json());
      }
      draw(selected);
      return outputs;
    };
  </script>
</body>
</html>
